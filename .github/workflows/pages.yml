name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main, feature/live-demo-website]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Minify JS and CSS
        run: |
          npx --yes terser docs/i18n.js -c -m -o /tmp/i18n.js
          npx --yes terser docs/pipeline.js -c -m -o /tmp/pipeline.js
          mv /tmp/i18n.js docs/i18n.js
          mv /tmp/pipeline.js docs/pipeline.js
          npx --yes lightningcss-cli --minify docs/style.css -o /tmp/style.css
          mv /tmp/style.css docs/style.css
          npx --yes html-minifier-terser \
            --minify-js --minify-css --remove-comments \
            -o /tmp/index.html docs/index.html
          mv /tmp/index.html docs/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
